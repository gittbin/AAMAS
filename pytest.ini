[pytest]
# MARL extension test suite. The legacy momgrap Stage-C pipeline stays in
# smoke_test.py (run separately); unit tests live under tests_marl/.
testpaths = tests_marl
# Make the repository root importable so `import momgrap` works under any cwd.
pythonpath = .
addopts = -ra
markers =
    slow: marks tests as slow to run (deselect with -m "not slow")
    cuda: marks tests that require a CUDA device (deselect with -m "not cuda")
