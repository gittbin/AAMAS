# Scientific-evaluation grid for run_ablation.py (Task 18).
# Small by default so it runs in seconds; expand the axes for a paper-scale sweep.
base_config: configs_marl/smoke.yaml
seeds: [0, 1, 2]
policy: heuristic_full_comm      # used when no --checkpoint is passed

grid:
  regimes: [LoS, Rayleigh, Rician]     # LoS / Rayleigh / Rician
  taus: [0.0, 0.1]                     # CSI error levels (subset of 0/0.05/0.1/0.2/0.3)
  delays: [1]                          # actor CSI delay (subset of 0/1/3/5)
  budgets: [1]                         # comm budget (subset of 0/1/2/full)
  comm_methods: [none, full, random, learned]   # + ea (needs an adjacency)
  inits: [uspa_zero_phase]             # random / uspa_zero_phase / ramp_knee
