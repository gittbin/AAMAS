# Locked paper-v2 physical/control protocol; runner varies named conditions only.
# Evaluator: interference-aware-v2. Inbox schema: 2.
physical:
  M: 16
  L: 64
  K: 4
  Q: 3
  bs_grid_rows: 4
  bs_grid_cols: 4
  ris_grid_rows: 8
  ris_grid_cols: 8
  device_str: cpu
  log_every: 0
dynamics:
  episode_length: 100
  dt_seconds: 0.01
  regime_sampling: uniform_episode
  gauss_markov_rho: 0.95
  mobility_enabled: true
  user_speed_min_mps: 0.5
  user_speed_max_mps: 2.0
  resample_scatter_directions_each_episode: true
csi:
  tau_train_min: 0.0
  tau_train_max: 0.20
  tau_eval: 0.10
  actor_delay_steps: 1
  beamformer_uses_current_estimate: true
  expose_tau_to_actor: true
  noise_scaling: rms
  feature_mode: normal
actions:
  power_codebook_size: 9
  ris_group_count: 8
  ris_phase_step_deg: 15.0
  ma_step_fraction_of_cell: 0.05
  ma_update_period: 10
communication:
  enabled: true
  graph_type: full
  max_messages_per_step: 1
  message_dim: 12
  message_cost: 0.01
  delivery_delay_steps: 1
reward:
  rate_scale: 8.0
  sensing_offset_db: 30.0
  sensing_scale_db: 40.0
  w_min_rate: 1.0
  w_sum_rate: 0.1
  w_sensing: 0.3
  w_outage: 1.0
  w_message: 0.01
  w_reconfiguration: 0.01
  w_violation: 1.0
  rate_target_bpshz: 1.0
rmappo:
  seed: 0
  total_timesteps: 400384
  num_envs: 8
  rollout_length: 128
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  entropy_coef: 0.01
  comm_entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  update_epochs: 4
  num_minibatches: 4
  hidden_size: 128
  sequence_length: 32
  eval_interval: 25000
  save_interval: 100096
  recurrent_actor: true
  centralized_actor_hidden_size: 224
